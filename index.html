<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Should I Evolve This Pokémon?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Should I Evolve This Pokémon?</h1>
    
    <div class="search-box">
      <!-- Scrollable selection list -->
      <select id="pokemonSelect" size="6" onchange="checkEvolution(this.value)">
        <option value="">Loading Pokémon list...</option>
      </select>
    </div>

    <div id="result"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
